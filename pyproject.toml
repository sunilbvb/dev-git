[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devgit-dashboard"
version = "1.0.0"
description = "A lightweight, standalone web dashboard for managing Git repositories across monorepos and multi-repo workspaces."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "DevGit Contributors" }
]
keywords = ["git", "monorepo", "dashboard", "melos", "multi-repo", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git"
]

[project.scripts]
devgit = "devgit.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["devgit*"]

[tool.setuptools.package-data]
devgit = ["frontend/*", "frontend/**/*"]
